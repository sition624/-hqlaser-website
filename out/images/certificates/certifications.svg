<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#0F1B2D"/>
  <rect x="40" y="40" width="720" height="520" rx="8" stroke="#1E3A5F" stroke-width="2" fill="#162032"/>
  
  <!-- Title -->
  <text x="400" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="28" font-weight="700" letter-spacing="2">CERTIFICATIONS</text>
  <line x1="300" y1="105" x2="500" y2="105" stroke="#3B82F6" stroke-width="2"/>
  
  <!-- CE Badge -->
  <g transform="translate(120, 150)">
    <rect width="140" height="140" rx="70" fill="#1A2740" stroke="#3B82F6" stroke-width="2"/>
    <text x="70" y="78" text-anchor="middle" fill="#3B82F6" font-family="Inter, sans-serif" font-size="42" font-weight="800">CE</text>
    <text x="70" y="105" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">EUROPEAN CONFORMITY</text>
  </g>
  
  <!-- ISO 9001 Badge -->
  <g transform="translate(300, 150)">
    <rect width="200" height="140" rx="8" fill="#1A2740" stroke="#3B82F6" stroke-width="2"/>
    <text x="100" y="60" text-anchor="middle" fill="#3B82F6" font-family="Inter, sans-serif" font-size="28" font-weight="800">ISO</text>
    <text x="100" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="24" font-weight="700">9001</text>
    <text x="100" y="118" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">QUALITY MANAGEMENT</text>
  </g>
  
  <!-- SGS Badge -->
  <g transform="translate(540, 150)">
    <rect width="140" height="140" rx="70" fill="#1A2740" stroke="#3B82F6" stroke-width="2"/>
    <text x="70" y="78" text-anchor="middle" fill="#3B82F6" font-family="Inter, sans-serif" font-size="36" font-weight="800">SGS</text>
    <text x="70" y="105" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">VERIFIED FACTORY</text>
  </g>
  
  <!-- FDA Badge -->
  <g transform="translate(300, 330)">
    <rect width="200" height="140" rx="8" fill="#1A2740" stroke="#3B82F6" stroke-width="2"/>
    <text x="100" y="60" text-anchor="middle" fill="#3B82F6" font-family="Inter, sans-serif" font-size="36" font-weight="800">FDA</text>
    <text x="100" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="500">REGISTERED</text>
    <text x="100" y="118" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">US LASER PRODUCTS</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="520" r="3" fill="#3B82F6" opacity="0.3"/>
  <circle cx="720" cy="520" r="3" fill="#3B82F6" opacity="0.3"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#1E3A5F" stroke-width="1"/>
  
  <!-- Company name -->
  <text x="400" y="555" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" letter-spacing="1">HEQING LASER - SHANDONG HEQING CNC EQUIPMENT CO., LTD.</text>
</svg>
